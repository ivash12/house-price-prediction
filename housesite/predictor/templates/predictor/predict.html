<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Amsterdam House Price Estimator</title>
</head>
<body>
    <header>
        <h1>Amsterdam House Price Estimator</h1>
        <p>
            Enter a few details about a property in Amsterdam and get an
            estimated asking price from a neural network trained with TensorFlow.
        </p>
    </header>


    <section id="input">
        <h2>Property details</h2>
        <form method="post">
    {% csrf_token %}

    <label for="area">Area (m²):</label>
    <input type="number" id="area" name="area" step="1" min="1" required value="{{ form_data.area }}">

    <label for="rooms">Rooms:</label>
    <input type="number" id="rooms" name="rooms" step="1" min="1" required value="{{ form_data.rooms }}">

    <label for="lat">Latitude:</label>
    <input type="number" id="lat" name="lat" step="any" required value="{{ form_data.lat }}">

    <label for="lon">Longitude:</label>
    <input type="number" id="lon" name="lon" step="any" required value="{{ form_data.lon }}">

    <button type="submit">Estimate price</button>
</form>
    </section>

    <section id="output">
        <h2>Estimated price</h2>
       {% if price %}
    <p>Estimated price: €{{ price|floatformat:0 }}</p>
        {% endif %}
    </section>
</body>
</html>
